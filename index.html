<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestus - RASTRO</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; }
        model-viewer { width: 100vw; height: 100vh; background: #fafafa; }
        #controls { position: absolute; top: 20px; left: 20px; z-index: 100; }
        button { padding: 15px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="controls">
        <button id="btn-record">Iniciar Rastro</button>
        <button id="btn-export" style="display:none;">Descargar JSON</button>
    </div>

    <model-viewer 
        id="main-viewer"
        src="gestus.glb" 
        ios-src="gestus.usdz" 
        ar 
        ar-modes="quick-look webxr scene-viewer" 
        camera-controls>
    </model-viewer>

    <script src="app.js" type="module"></script>
</body>
</html>
